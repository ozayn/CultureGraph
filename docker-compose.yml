services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: culturegraph
      POSTGRES_PASSWORD: culturegraph
      POSTGRES_DB: culturegraph
    ports:
      - "5432:5432"
    volumes:
      - culturegraph_pg:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro

volumes:
  culturegraph_pg:
